# Jaymod-AC cvar rules.
#
# Drop this file (renamed to `ac_cvars.cfg`) into your server's etmain or
# mod data directory and restart the map.  Each rule queries the client's
# value for the named cvar and triggers a violation when the rule matches.
#
# Format (whitespace-tokenised; `#` = comment to end-of-line):
#
#   <cvarname>  <kind>  <args...>  <severity>
#
# Kinds:
#   eq        <value>       -- violate when cvar == value
#   ne        <value>       -- violate when cvar != value
#   range     <min> <max>   -- violate when numeric value OUTSIDE [min, max]
#   notrange  <min> <max>   -- violate when numeric value INSIDE  [min, max]
#
# Severity:
#   HARD  -- record violation; if g_acStrict 1, ban + drop
#   SOFT  -- accumulate score, notify admins via cpm
#   INFO  -- log only

# ---- wallhack-class render hacks ----
r_showtris       eq        1                HARD
r_drawentities   eq        0                HARD
r_lightmap       eq        1                HARD
r_fullbright     eq        1                HARD
cg_thirdperson   eq        1                HARD

# ---- FOV + view sanity
cg_fov           range     60    130        HARD
r_znear          range     3     5          SOFT

# ---- frame timing / input sanity ----
com_maxfps       range     30    250        SOFT
sensitivity      range     0.01  30         SOFT
m_pitch          notrange  -0.001 0.001     SOFT
m_yaw            notrange  -0.001 0.001     SOFT

# ---- texture clarity (cheaters maximise contrast) ----
r_picmip         range     0     16         SOFT

# ---- gun-clip exploit ----
cg_drawgun       eq        0                SOFT
