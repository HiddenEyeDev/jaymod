# Jaymod-AC file-hash BLOCKLIST.
#
# Drop this file (renamed to `ac_files.cfg`) into your server's etmain or
# mod data directory and restart the map.  Each line names a forbidden
# combination of (file, CRC32-IEEE).  Anything not on this list is allowed.
#
# Format (pipe-separated; `#` = comment to end-of-line):
#
#   <path>|<crc32hex>|<severity>
#
# Severity:
#   HARD  -- record violation; if g_acStrict 1, ban + drop
#   SOFT  -- accumulate score, notify admins via cpm
#   INFO  -- log only
#   (severity field is optional; defaults to SOFT)
#
# Multiple lines with the same path are supported — useful for blocking
# several known variants of the same file (e.g. several cheat repacks of
# cgame_mp_x86.dll all carrying different CRC32s).
#
# How to find a hash:
#   - Get the bad file
#   - Run any CRC32-IEEE tool (PowerShell: Get-FileHash -Algorithm CRC32)
#   - Use the 8-char lowercase hex form
#
# Example entries (replace with real hashes from cheats you've collected):
#
# pak3.pk3              | deadbeef | HARD
# cgame_mp_x86.dll      | cafebabe | HARD
# cgame_mp_x86.dll      | f00dface | HARD
# wolfconfig_mp.cfg     | 12345678 | SOFT
